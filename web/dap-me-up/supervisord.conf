[supervisord]
nodaemon=true
user=root

[program:openldap_entrypoint]
command=/opt/bitnami/scripts/openldap/entrypoint.sh /opt/bitnami/scripts/openldap/setup.sh
autostart=true
autorestart=false

[program:openldap]
command=bash -c "sleep 5 && /opt/bitnami/scripts/openldap/run.sh"
autostart=true
autorestart=true

[program:apache]
command=/usr/sbin/apachectl -D FOREGROUND
autostart=true
autorestart=true
