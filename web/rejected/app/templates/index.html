<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAMUCTF Developer Job Form</title>
    <link rel="stylesheet"  href="{{ url_for('static', filename='styles/style.css') }}" >
</head>
<body>
    <div class="container">
        <h1>TAMUCTF Developer Job Form</h1>
        <form action="/apply" method="post" enctype="multipart/form-data">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">School Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="position">Preferred Challenge Category:</label>
            <select id="position" name="position" required>
                <option value="">Select your favorite ctf category</option>
                <option value="Pwn">Pwn</option>
                <option value="Web">Web</option>
                <option value="Forensics">Forensics</option>
                <option value="Crypto">Crypto</option>
                <option value="Rev">Reverse Engineering</option>
                <option value="Misc">*shudders* Misc</option>
            </select>
            
            <label for="experience">Years of Experience:</label>
            <input type="text" id="experience" name="experience" required>
            
            <label for="skills">Key Skills:</label>
            <textarea id="skills" name="skills" rows="4" required></textarea>
            
            <div class="file-upload">
                <label for="resume">Upload Resume (optional):</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            </div>
            
            <input type="submit" value="Submit Application">
        </form>
    </div>
</body>
</html>
